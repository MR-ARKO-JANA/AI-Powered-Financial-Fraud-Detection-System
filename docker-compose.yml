services:
  finguard-backend:
    build: .
    container_name: finguard_backend
    ports:
      - "8000:8000"
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FINGUARD_API_KEYS=${FINGUARD_API_KEYS}
      - FINGUARD_CORS_ORIGINS=http://localhost:8501,http://finguard-dashboard:8501
    volumes:
      - finguard-data:/app/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  finguard-dashboard:
    build: .
    container_name: finguard_dashboard
    ports:
      - "8501:8501"
    command: python -m streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - API_URL=http://finguard-backend:8000
    volumes:
      - finguard-data:/app/data
    depends_on:
      finguard-backend:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  finguard-data:
    driver: local
