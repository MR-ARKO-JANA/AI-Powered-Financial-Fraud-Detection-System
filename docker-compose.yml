version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: finguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: finguard_secret
      POSTGRES_DB: finguard_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard -d finguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finguard_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  finguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finguard_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://finguard:finguard_secret@postgres:5432/finguard_db
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
    driver: local
